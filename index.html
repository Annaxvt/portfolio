<!-- ================================
     WOXIN AUTOMATION COMMISSION FORM
     ================================ -->

<form
    action="https://formspree.io/f/xaewoayq"
    method="POST"
    enctype="multipart/form-data"
    id="commissionForm"
>

    <!-- Hidden Subject -->
    <input
        type="hidden"
        name="_subject"
        value="New Woxin Automation Commission Request"
    >

    <!-- NAME -->
    <div class="form-group">
        <label for="client-name">Your Name</label>

        <input
            type="text"
            id="client-name"
            name="name"
            placeholder="Enter your name"
            autocomplete="name"
            required
        >
    </div>


    <!-- EMAIL -->
    <div class="form-group">
        <label for="client-email">Email Address</label>

        <input
            type="email"
            id="client-email"
            name="email"
            placeholder="your@email.com"
            autocomplete="email"
            required
        >
    </div>


    <!-- DISCORD -->
    <div class="form-group">
        <label for="client-discord">Discord Username</label>

        <input
            type="text"
            id="client-discord"
            name="discord"
            placeholder="example_username"
            required
        >
    </div>


    <!-- PROJECT TYPE -->
    <div class="form-group">
        <label for="project-type">What do you need?</label>

        <select
            id="project-type"
            name="project"
            required
        >
            <option value="" disabled selected>
                Select a service
            </option>

            <option value="VTuber Model">
                VTuber Model
            </option>

            <option value="3D VTuber Model">
                3D VTuber Model
            </option>

            <option value="VTuber ID Card">
                VTuber ID Card
            </option>

            <option value="Logo Design">
                Logo Design
            </option>

            <option value="Banner Design">
                Banner Design
            </option>

            <option value="Emotes">
                Emotes
            </option>

            <option value="Stream Overlay">
                Stream Overlay
            </option>

            <option value="3D Art Room">
                3D Art Room
            </option>

            <option value="Creative Scene">
                Creative Scene
            </option>

            <option value="Other">
                Other
            </option>
        </select>
    </div>


    <!-- BUDGET -->
    <div class="form-group">
        <label for="client-budget">
            Estimated Budget
        </label>

        <select
            id="client-budget"
            name="budget"
        >
            <option value="" disabled selected>
                Select your budget
            </option>

            <option value="$50 - $100">
                $50 - $100
            </option>

            <option value="$100 - $250">
                $100 - $250
            </option>

            <option value="$250 - $500">
                $250 - $500
            </option>

            <option value="$500 - $1000">
                $500 - $1000
            </option>

            <option value="$1000+">
                $1000+
            </option>

            <option value="Not sure yet">
                I'm not sure yet
            </option>
        </select>
    </div>


    <!-- DEADLINE -->
    <div class="form-group">
        <label for="project-deadline">
            Desired Deadline
        </label>

        <input
            type="date"
            id="project-deadline"
            name="deadline"
        >
    </div>


    <!-- PROJECT DETAILS -->
    <div class="form-group">
        <label for="project-details">
            Tell Me About Your Project
        </label>

        <textarea
            id="project-details"
            name="message"
            rows="7"
            placeholder="Tell me about your project, character, style, colors, animations, ideas, etc."
            required
        ></textarea>
    </div>


    <!-- REFERENCE IMAGES -->
    <div class="form-group">
        <label for="reference-files">
            Reference Images
        </label>

        <input
            type="file"
            id="reference-files"
            name="references"
            accept=".png,.jpg,.jpeg,.webp"
            multiple
        >

        <small>
            Upload PNG, JPG, JPEG or WEBP reference images.
        </small>
    </div>


    <!-- ADDITIONAL NOTES -->
    <div class="form-group">
        <label for="additional-notes">
            Additional Notes
        </label>

        <textarea
            id="additional-notes"
            name="notes"
            rows="4"
            placeholder="Anything else you'd like me to know?"
        ></textarea>
    </div>


    <!-- SUBMIT BUTTON -->
    <button
        type="submit"
        class="submit-btn"
        id="submitButton"
    >
        Send Commission Request
    </button>

</form>


<!-- ================================
     SUCCESS MESSAGE
     ================================ -->

<div
    id="formSuccess"
    class="form-success"
    style="display:none;"
>

    <div class="success-icon">
        ✓
    </div>

    <h3>
        Request Received!
    </h3>

    <p>
        Thank you for contacting Woxin Automation.
        Your commission request has been successfully submitted.
    </p>

    <p>
        I'll review your project and get back to you soon.
    </p>

    <div class="contact-success">
        <strong>Discord:</strong>
        Woxinart_automation
    </div>

</div>


<!-- ================================
     FORM SUBMISSION SCRIPT
     ================================ -->

<script>

const commissionForm =
    document.getElementById("commissionForm");

const submitButton =
    document.getElementById("submitButton");

const formSuccess =
    document.getElementById("formSuccess");


commissionForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        /* Button loading state */

        submitButton.disabled = true;

        submitButton.innerHTML =
            "Sending Request...";


        /* Collect form data */

        const formData =
            new FormData(commissionForm);


        try {

            const response =
                await fetch(
                    commissionForm.action,
                    {
                        method: "POST",
                        body: formData,
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            /* Successful submission */

            if (response.ok) {

                commissionForm.reset();

                commissionForm.style.display =
                    "none";

                formSuccess.style.display =
                    "block";

                formSuccess.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }

            /* Formspree error */

            else {

                submitButton.disabled =
                    false;

                submitButton.innerHTML =
                    "Send Commission Request";

                alert(
                    "Something went wrong. Please try again."
                );
            }

        }

        /* Internet / connection error */

        catch (error) {

            submitButton.disabled =
                false;

            submitButton.innerHTML =
                "Send Commission Request";

            alert(
                "Unable to send your request. Please check your internet connection and try again."
            );

        }

    }
);

</script>
