<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #17121f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ffb6e6;
        }

        .subtitle {
            color: #cfc3d8;
            margin-bottom: 45px;
            font-size: 18px;
        }

        .folders {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .folder {
            background: #251c30;
            border: 2px solid #4b3858;
            border-radius: 20px;
            padding: 45px 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .folder:hover {
            transform: translateY(-8px);
            border-color: #ff9ddd;
            background: #30243c;
            box-shadow: 0 10px 30px rgba(255, 157, 221, 0.2);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .folder h2 {
            color: #fff;
            font-size: 25px;
        }

        @media (max-width: 600px) {
            .folders {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Portfolio</h1>

        <p class="subtitle">
            VTuber • Design • Creative Work
        </p>

        <div class="folders">

            <div class="folder">
                <div class="icon">📁</div>
                <h2>VTuber</h2>
            </div>

            <div class="folder">
                <div class="icon">📁</div>
                <h2>Logo</h2>
            </div>

            <div class="folder">
                <div class="icon">📁</div>
                <h2>Banner</h2>
            </div>

            <div class="folder">
                <div class="icon">📁</div>
                <h2>Emotes</h2>
            </div>

        </div>

    </div>

</body>
</html>
